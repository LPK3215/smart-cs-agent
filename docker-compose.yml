# Smart-CS-Agent — full stack (backend + frontend)
# Usage:
#   docker compose up --build
#   frontend:  http://localhost:8080
#   backend:   http://localhost:8000/docs
#
# Optional: create smart-cs-server/.env from .env.example (gitignored).

services:
  backend:
    build: ./smart-cs-server
    container_name: smart-cs-backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DATA_SOURCE=${DATA_SOURCE:-mock}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - DATABASE_PATH=/app/data/smart_cs.db
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      # Persist SQLite only — do not overlay the whole /app image
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./smart-cs-web
    container_name: smart-cs-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
